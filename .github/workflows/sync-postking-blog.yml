name: Sync Postking blog

on:
  schedule:
    # Daily 05:00 UTC ≈ 06:00–07:00 Prague (CET/CEST).
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List planned inserts/updates without writing to Supabase'
        type: boolean
        default: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund

      - name: Sync Shorty Harris PostKing articles
        id: sync
        working-directory: app
        env:
          POSTKING_API_TOKEN: ${{ secrets.POSTKING_API_TOKEN }}
          POSTKING_API_URL: ${{ secrets.POSTKING_API_URL }}
          POSTKING_BRAND_ID: cmvgju3fk1bg9g07zorefgwgu
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: npm run sync:postking-blog

      # /blog/:slug pages and sitemap.xml are prerendered by `postbuild`
      # (generate:blog-html), so newly published posts only get real pages after
      # a redeploy. Needs a Vercel Deploy Hook URL in the VERCEL_DEPLOY_HOOK_URL secret.
      - name: Trigger Vercel rebuild
        if: steps.sync.outputs.published_writes != '' && steps.sync.outputs.published_writes != '0'
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "::warning::${{ steps.sync.outputs.published_writes }} published post(s) written but VERCEL_DEPLOY_HOOK_URL is not set; new pages will not be prerendered until the next deploy."
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
